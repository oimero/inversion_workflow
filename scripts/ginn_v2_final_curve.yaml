workflow_config: experiments/common/common.yaml
ginn_v2_body_inversion:
  inputs:
    lfm_run_dir: scripts/output/real_field_lfm_20260930_final_curve
    variant_id: proportional_slice_baseline
    well_control_run_dir: scripts/output/real_field_well_controls_20260928_rgt
    forward_model_inputs: scripts/output/depth_forward_model_inputs_20260826_refactor/forward_model_inputs.json
  training:
    body_smoothing_fwhm_m: 25.0
    selection_weights:
      well_rmse: 1.0
      amplitude_mapping: 0.5
    trusted_well_names:
    - 2-ANP-2A-RJS
    - L1-NW1
    - L5-NW5
    - L9-NW4A
    - NW11
    patch_radius: 8
    batch_size: 8
    pretrain_epochs: 1
    finetune_epochs: 3
    pretrain_learning_rate: 0.001
    finetune_learning_rate: 0.0002
    log_every_batches: 20
    max_train_centers: 512
    max_validation_centers: 128
    review_fraction: 0.04
    validation_gap_m: 300.0
    validation_anchor: maxmin
    well_batch_multiplier: 2
    waveform_qc_dynamic_window_m: 75.0
    seismic_feature_mode: local_amplitude_balanced
    seismic_balance_window_samples: 31
    seismic_balance_floor_fraction: 0.1
    orientations:
    - inline
    - xline
    device: cuda
    loss_weights:
      seismic_shape: 1.0
      trusted_well_body: 1.0
      trusted_well_derivative: 0.5
      trusted_well_seismic_shape: 0.25
      lambda_shape: 0.25
    warnings:
      pretrain_masked_corr_improvement: 0.01
      pretrain_masked_shape_ratio: 0.99
      masked_corr_drop_tolerance: 0.01
      well_pooled_rmse_ratio_max: 1.0
      seismic_body_amplitude_spearman_max: 0.4
final_curve_experiment:
  proportional_npz: scripts/output/real_field_lfm_20260930_final_curve/variants/proportional_slice_baseline/lfm.npz
  well_control_run_dir: scripts/output/real_field_well_controls_20260928_rgt
  forward_model_inputs: scripts/output/depth_forward_model_inputs_20260826_refactor/forward_model_inputs.json
  seismic_npy: scripts/output/rgt_property_model_20260928_full/seismic.npy
  seismic_axes_npz: scripts/output/rgt_property_model_20260928_full/axes.npz
  section_inline: 1631
  prepared_inputs_dir: experiments/ginn_v2/results/lfm_no_gain_20260929/inputs
  comparison_run: experiments/ginn_v2/results/lfm_no_gain_20260929/proportional
